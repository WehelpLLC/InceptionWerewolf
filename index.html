<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我最喜欢玩的角色！· 北美盗梦空间狼人杀联赛</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06081a;--panel:rgba(20,25,37,0.92);--line:rgba(200,160,40,0.2);
  --gold:#c8a030;--gold2:#fdd840;--text:rgba(232,210,130,0.9);--dim:rgba(200,160,40,0.4);
  --win-bg:rgba(255,215,60,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);background-image:radial-gradient(ellipse at 50% 20%,#0d1138 0%,#06081a 70%);
  color:var(--text);font-family:'Noto Serif SC',serif;min-height:100vh;}

/* ── 输入名字页 ── */
.name-page{display:none;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 20px;}
.n-badge{font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:4px;
  color:var(--dim);margin-bottom:16px;}
.n-title{font-size:26px;font-weight:900;letter-spacing:4px;color:var(--gold2);
  text-shadow:0 0 30px rgba(255,210,40,0.3);margin-bottom:8px;text-align:center;}
.n-sub{font-size:13px;color:var(--dim);letter-spacing:2px;margin-bottom:36px;}
.n-box{width:100%;max-width:360px;}
.n-input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px 22px;color:var(--text);font-size:20px;outline:none;
  font-family:'Noto Serif SC',serif;letter-spacing:2px;text-align:center;
  margin-bottom:10px;transition:border-color .2s;}
.n-input:focus{border-color:var(--gold);}
.n-input::placeholder{color:var(--dim);font-size:16px;}
.n-hint{text-align:center;font-size:13px;color:var(--dim);letter-spacing:1px;min-height:22px;margin-bottom:14px;}
.n-hint.ok{color:rgba(80,200,120,0.9);}
.n-hint.new{color:var(--gold);}
.n-emoji-wrap{margin-bottom:16px;display:none;}
.n-emoji-label{font-size:10px;color:var(--dim);letter-spacing:2px;text-align:center;margin-bottom:10px;}
.n-emoji-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.n-emoji-btn{font-size:22px;width:42px;height:42px;border-radius:10px;background:transparent;
  border:1px solid transparent;cursor:pointer;transition:all .12s;}
.n-emoji-btn.sel{background:rgba(200,160,40,0.2);border-color:var(--gold);}
.n-btn{width:100%;background:rgba(255,215,60,0.08);border:1px solid rgba(255,215,60,0.25);
  color:rgba(255,215,60,0.35);border-radius:12px;padding:16px;font-size:16px;
  font-weight:700;letter-spacing:3px;cursor:pointer;font-family:'Noto Serif SC',serif;
  transition:all .2s;pointer-events:none;}
.n-btn.ready{background:rgba(255,215,60,0.14);border-color:rgba(255,215,60,0.55);
  color:var(--gold2);pointer-events:auto;}
.n-err{color:rgba(181,69,58,.9);font-size:12px;text-align:center;margin-top:8px;display:none;}

/* ── 排行榜页 ── */
.bracket-page{display:none;flex-direction:column;min-height:100vh;padding:0 0 60px;}

/* 顶栏 */
.b-topbar{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:rgba(6,8,26,0.96);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:100;backdrop-filter:blur(8px);}
.b-topname{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--gold2);}
.b-topbadge{font-size:10px;color:var(--dim);letter-spacing:1px;}
.b-change{background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;
  letter-spacing:1px;font-family:'Noto Serif SC',serif;padding:6px 10px;}
.b-change:hover{color:var(--gold);}

/* 头部 */
.b-header{text-align:center;padding:28px 20px 20px;border-bottom:1px solid var(--line);}
.b-emoji{font-size:48px;margin-bottom:10px;}
.b-name{font-size:22px;font-weight:900;letter-spacing:4px;color:var(--gold2);
  text-shadow:0 0 20px rgba(255,210,40,0.3);}
.b-title{font-size:13px;color:var(--dim);letter-spacing:2px;margin-top:8px;}

/* 前三名展示 */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;
  padding:20px 16px;max-width:480px;margin:0 auto;}
.pod-card{text-align:center;padding:14px 16px;border-radius:10px;min-width:90px;}
.pod-card.p1{background:rgba(255,215,60,0.14);border:1px solid rgba(255,215,60,0.5);order:2;}
.pod-card.p2{background:rgba(180,180,180,0.07);border:1px solid rgba(180,180,180,0.25);order:1;}
.pod-card.p3{background:rgba(180,120,40,0.07);border:1px solid rgba(180,120,40,0.25);order:3;}
.pod-icon{font-size:24px;margin-bottom:6px;}
.pod-rank{font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:4px;}
.pod-role{font-size:14px;font-weight:900;letter-spacing:1px;}
.pod-card.p1 .pod-role{color:var(--gold2);}
.pod-card.p2 .pod-role{color:rgba(220,220,220,.85);}
.pod-card.p3 .pod-role{color:rgba(220,160,60,.85);}

/* 对阵区域 */
.bracket-wrap{max-width:480px;margin:0 auto;padding:0 16px;}
.round-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.round-title{font-size:16px;font-weight:900;color:var(--gold2);letter-spacing:2px;}
.round-prog{font-size:11px;color:var(--dim);}

/* 轮次标签 */
.round-tabs{display:flex;gap:5px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding:0 16px;}
.round-tabs::-webkit-scrollbar{display:none;}
.rtab{flex-shrink:0;padding:6px 12px;border-radius:12px;font-size:11px;letter-spacing:1px;
  border:1px solid var(--line);color:var(--dim);cursor:pointer;transition:all .12s;
  font-family:'Noto Serif SC',serif;}
.rtab.active{background:rgba(200,160,40,0.15);border-color:var(--gold);color:var(--gold);}
.rtab.done{color:rgba(80,200,120,.8);border-color:rgba(80,200,120,.3);}
.rtab.locked{opacity:.3;cursor:not-allowed;}

/* 对阵卡片 */
.match-card{background:var(--panel);border:1px solid rgba(200,160,40,0.13);border-radius:10px;
  padding:14px 14px 12px;margin-bottom:10px;}
.match-card.decided{border-color:rgba(200,160,40,0.07);}
.match-num{font-size:10px;color:var(--dim);text-align:center;margin-bottom:10px;
  font-family:'Courier Prime',monospace;}
.m-slot{width:100%;padding:15px 16px;border-radius:8px;font-size:16px;font-weight:600;
  letter-spacing:1px;text-align:center;cursor:pointer;transition:all .12s;
  border:1px solid rgba(200,160,40,0.16);color:var(--text);margin:4px 0;
  background:transparent;font-family:'Noto Serif SC',serif;}
.m-slot:active{transform:scale(.98);}
.m-slot.winner{background:var(--win-bg);border-color:var(--gold2);color:var(--gold2);font-weight:900;}
.m-slot.loser{color:rgba(200,160,40,0.14);text-decoration:line-through;
  cursor:not-allowed;background:rgba(0,0,0,0.15);pointer-events:none;}
.m-slot.pending{color:rgba(200,160,40,0.14);font-style:italic;cursor:not-allowed;}
.m-vs{text-align:center;font-size:10px;color:rgba(200,160,40,0.22);letter-spacing:2px;}
.m-next{text-align:center;padding:16px 0 4px;}
.m-next-btn{padding:14px 0;background:rgba(255,215,60,0.1);border:1px solid rgba(255,215,60,0.35);
  color:var(--gold2);font-size:14px;letter-spacing:2px;border-radius:8px;cursor:pointer;
  font-family:'Noto Serif SC',serif;width:100%;}
.m-locked{text-align:center;padding:30px;color:var(--dim);font-size:13px;}
.m-champ{text-align:center;padding:24px;background:rgba(255,215,60,0.1);
  border:1px solid rgba(255,215,60,0.35);border-radius:10px;margin:0 16px;}
.m-champ-icon{font-size:36px;margin-bottom:10px;}
.m-champ-name{font-size:24px;font-weight:900;color:var(--gold2);letter-spacing:3px;margin:8px 0;}
.m-reset{display:block;margin:16px auto 0;background:none;border:1px solid var(--line);
  color:var(--dim);border-radius:8px;padding:8px 20px;font-size:12px;cursor:pointer;
  font-family:'Noto Serif SC',serif;letter-spacing:1px;}
.m-reset:hover{border-color:var(--gold);color:var(--gold);}


/* ── 管理员页 ── */
.admin-page{display:none;flex-direction:column;min-height:100vh;padding:0 0 60px;}
.a-topbar{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:rgba(6,8,26,0.96);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:100;backdrop-filter:blur(8px);}
.a-title{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--gold2);}
.a-back{background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;
  letter-spacing:1px;font-family:'Noto Serif SC',serif;padding:6px 10px;}
.a-back:hover{color:var(--gold);}
.a-wrap{max-width:600px;margin:0 auto;padding:16px;}
.a-sec{margin-bottom:24px;}
.a-sec-title{font-size:11px;letter-spacing:3px;color:var(--dim);
  margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.vote-row{display:grid;grid-template-columns:24px 1fr 80px 80px 80px;align-items:center;
  gap:8px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;margin-bottom:6px;font-size:13px;}
.vtag{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:1px;white-space:nowrap;}
.vtag.p1{background:rgba(224,180,99,0.2);border:1px solid rgba(224,180,99,0.5);color:var(--gold2);}
.vtag.p2{background:rgba(180,180,180,0.1);border:1px solid rgba(180,180,180,0.3);color:#ccc;}
.vtag.p3{background:rgba(180,120,40,0.1);border:1px solid rgba(180,120,40,0.3);color:#cd9a40;}
.a-summary{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;}
.a-bar-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid rgba(200,160,40,0.07);}
.a-bar-row:last-child{border-bottom:none;}
.a-bar-role{font-size:12px;min-width:65px;}
.a-bar-wrap{flex:1;background:rgba(200,160,40,0.1);border-radius:4px;height:5px;}
.a-bar-fill{height:100%;border-radius:4px;background:var(--gold);}
.a-bar-cnt{font-size:11px;color:var(--dim);min-width:28px;text-align:right;font-family:'Courier Prime',monospace;}
/* 管理员入口按钮（低调） */
.admin-entry{display:block;margin:32px auto 0;background:none;
  border:1px solid rgba(200,160,40,0.3);border-radius:8px;
  color:rgba(200,160,40,0.5);cursor:pointer;font-size:12px;letter-spacing:2px;
  font-family:'Noto Serif SC',serif;padding:10px 24px;}
.admin-entry:hover{color:var(--gold);border-color:var(--gold);}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(80,200,120,0.9);color:#fff;padding:8px 20px;border-radius:16px;
  font-size:12px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}


/* ── 管理员锁定页（全屏覆盖） ── */
.admin-lock{position:fixed;inset:0;background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;z-index:999;padding:20px;}
.admin-lock.show{display:flex;}
.lock-badge{font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:4px;color:var(--dim);}
.lock-title{font-size:18px;font-weight:900;letter-spacing:4px;color:var(--gold2);}
.lock-sub{font-size:12px;color:var(--dim);letter-spacing:2px;}
.lock-input{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 20px;color:var(--text);font-size:18px;outline:none;text-align:center;
  letter-spacing:4px;width:240px;font-family:'Courier Prime',monospace;}
.lock-input:focus{border-color:var(--gold);}
.lock-btn{background:var(--gold2);color:#2B1F0A;border:none;border-radius:10px;
  padding:14px 36px;font-weight:700;font-size:15px;cursor:pointer;
  font-family:'Noto Serif SC',serif;letter-spacing:2px;}
.lock-back{background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;
  letter-spacing:1px;margin-top:4px;font-family:'Noto Serif SC',serif;}
.lock-err{color:rgba(181,69,58,.9);font-size:12px;letter-spacing:1px;display:none;}
/* 生成结果图 */
.gen-btn{width:100%;margin-top:12px;padding:14px;background:rgba(255,215,60,0.12);
  border:1px solid rgba(255,215,60,0.45);color:var(--gold2);border-radius:10px;
  font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;
  font-family:'Noto Serif SC',serif;}
.gen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);
  z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
.gen-overlay.show{display:flex;}
.gen-txt{color:var(--gold2);font-size:14px;letter-spacing:3px;}
/* 结果图卡片 */
.result-card{position:fixed;left:-9999px;top:0;width:680px;
  background:linear-gradient(160deg,#060918 0%,#080c20 50%,#050810 100%);
  padding:44px 48px;font-family:'Noto Serif SC',serif;color:#e8d070;
  border:2px solid rgba(200,160,40,0.35);}
.rc-logo{font-size:10px;letter-spacing:5px;color:rgba(200,160,40,0.45);margin-bottom:10px;}
.rc-title{font-size:24px;font-weight:900;letter-spacing:5px;color:#fdd840;
  text-shadow:0 0 30px rgba(255,210,40,0.4);margin-bottom:6px;}
.rc-player{font-size:16px;letter-spacing:3px;color:rgba(200,160,40,0.6);margin-bottom:28px;
  padding-bottom:16px;border-bottom:1px solid rgba(200,160,40,0.2);}
.rc-podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin-bottom:24px;}
.rc-p{text-align:center;padding:20px 24px;border-radius:10px;}
.rc-p.p1{background:rgba(255,215,60,0.14);border:1px solid rgba(255,215,60,0.5);order:2;min-width:160px;}
.rc-p.p2{background:rgba(180,180,180,0.08);border:1px solid rgba(180,180,180,0.3);order:1;min-width:130px;}
.rc-p.p3{background:rgba(180,120,40,0.08);border:1px solid rgba(180,120,40,0.3);order:3;min-width:130px;}
.rc-icon{font-size:32px;margin-bottom:8px;}
.rc-rank{font-size:10px;letter-spacing:2px;color:rgba(200,160,40,0.5);margin-bottom:6px;}
.rc-name{font-size:20px;font-weight:900;letter-spacing:2px;}
.rc-p.p1 .rc-name{color:#fdd840;}
.rc-p.p2 .rc-name{color:rgba(220,220,220,.9);}
.rc-p.p3 .rc-name{color:rgba(220,160,60,.9);}
.rc-footer{text-align:center;font-size:10px;letter-spacing:3px;
  color:rgba(200,160,40,0.3);margin-top:20px;padding-top:16px;
  border-top:1px solid rgba(200,160,40,0.15);}
</style>
</head>
<body>

<!-- 输入名字页 -->
<div class="name-page" id="namePage">
  <div class="n-badge">北美盗梦空间狼人杀联赛 · Season 3</div>
  <div class="n-title">我最喜欢玩的角色！</div>
  <div class="n-sub">输入你的名字开始</div>
  <div class="n-box">
    <input class="n-input" id="nameInput" placeholder="你叫什么名字？"
      maxlength="12" autocomplete="off" autocorrect="off" spellcheck="false"
      oninput="onName(this.value)"
      onkeydown="if(event.key==='Enter')enter()">
    <div class="n-hint" id="nameHint"></div>
    <div class="n-emoji-wrap" id="emojiWrap">
      <div class="n-emoji-label">选个头像</div>
      <div class="n-emoji-grid" id="emojiGrid"></div>
    </div>
    <button class="n-btn" id="enterBtn" onclick="enter()">进入 →</button>
    <div class="n-err" id="nameErr"></div>
  </div>
  <button class="admin-entry" onclick="openAdmin()">管理员入口</button>
</div>

<!-- 排行榜页 -->
<div class="bracket-page" id="bracketPage">
  <div class="b-topbar">
    <div>
      <div class="b-topname" id="topName"></div>
      <div class="b-topbadge">北美盗梦空间狼人杀联赛</div>
    </div>
    <button class="b-change" onclick="changeName()">换人</button>
  </div>

  <div class="b-header">
    <div class="b-emoji" id="headerEmoji"></div>
    <div class="b-name" id="headerName"></div>
    <div class="b-title">我最喜欢玩的角色排行榜！</div>
  </div>

  <!-- 前三名（完成后显示） -->
  <div id="podiumWrap" style="display:none;">
    <div class="podium" id="podium"></div>
    <button class="m-reset" onclick="resetBracket()">重新选择</button>
  </div>

  <!-- 对阵区 -->
  <div id="bracketArea" style="margin-top:20px;">
    <div class="round-tabs" id="roundTabs"></div>
    <div class="bracket-wrap" id="matchArea"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ Firebase ══
const DB='https://werewolf-favourite-tournament-default-rtdb.firebaseio.com';
const PATH='tournament/playerBrackets';
const fb={
  async get(p){try{const r=await fetch(`${DB}/${p}.json`);return r.ok?await r.json():null;}catch{return null;}},
  async put(p,d){try{await fetch(`${DB}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});}catch{}}
};

// ══ Roles ══
const ROLES=["混血儿","平民","预言家","女巫","猎人","白神","守卫","骑士","摄梦人","魔术师","通灵师","守墓人","猎魔人","定序王子","奇迹商人","舞者","蒙面人","禁言长老","狼人","狼王","白狼王","狼美人","石像鬼","隐狼","机械狼","恶灵骑士","梦魔","血月使徒","诡术师","假面","盗宝大师","狼术师"];
const N=[16,8,4,2,1],TOTAL=5;
const RNAMES=['第一轮','第二轮','第三轮','半决赛','决赛'];
const EMOJIS=['🐺','🦊','🌙','⚔️','🔮','🎭','🗡️','🌟','🎪','👑','🏆','🎲','🌸','🔥','💎','🦅','🎯','🌊','🌿','🎸','🐉','🦁','🌕','🎴','🃏','🎰','🌈','🧊','🔱','🎵'];

// ══ State ══
let curName='', curEmoji='🎭', isNew=false;
let wins=[{},{},{},{},{}], curRound=0, navd=false;

// ══ Name Page ══
function onName(val){
  const name=val.trim();
  const hint=document.getElementById('nameHint');
  const btn=document.getElementById('enterBtn');
  const ew=document.getElementById('emojiWrap');
  document.getElementById('nameErr').style.display='none';

  if(!name){
    hint.textContent=''; hint.className='n-hint';
    btn.className='n-btn'; ew.style.display='none'; isNew=false; return;
  }
  // Check Firebase in background (we'll check on submit)
  hint.textContent=''; hint.className='n-hint';
  btn.className='n-btn ready';
  curName=name;
}

async function enter(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name) return;
  curName=name;
  const err=document.getElementById('nameErr');
  err.style.display='none';

  // Encode name for Firebase key (replace special chars)
  const key=encodePlayerKey(name);

  // Load existing data
  const data=await fb.get(`${PATH}/${key}`);
  if(data){
    // 已有玩家
    curEmoji=data.emoji||'🎭';
    wins=normWins(data.wins);
    isNew=false;
  } else {
    // 新玩家 - 选头像
    const ew=document.getElementById('emojiWrap');
    const eg=document.getElementById('emojiGrid');
    if(!eg.children.length){
      eg.innerHTML=EMOJIS.map(e=>`<button class="n-emoji-btn${e===curEmoji?' sel':''}" onclick="pickEmoji('${e}',this)">${e}</button>`).join('');
    }
    ew.style.display='block';
    const hint=document.getElementById('nameHint');
    hint.textContent='✨ 新玩家，选个头像再进入';
    hint.className='n-hint new';
    isNew=true;
    // Wait for emoji selection then user clicks enter again
    return;
  }

  goToBracket();
}

function pickEmoji(e,btn){
  curEmoji=e;
  document.querySelectorAll('.n-emoji-btn').forEach(b=>{b.className='n-emoji-btn';});
  btn.className='n-emoji-btn sel';
  // Now allow entering
  goToBracket();
}

function goToBracket(){
  // Save player info
  const key=encodePlayerKey(curName);
  fb.put(`${PATH}/${key}`,{name:curName,emoji:curEmoji,wins,updated:new Date().toISOString()});

  // Show bracket page
  document.getElementById('namePage').style.display='none';
  document.getElementById('bracketPage').style.display='flex';
  document.getElementById('topName').textContent=`${curEmoji} ${curName}`;
  document.getElementById('headerEmoji').textContent=curEmoji;
  document.getElementById('headerName').textContent=curName;
  window.scrollTo(0,0);
  navd=false;
  initRound();
  renderBracket();
}

function changeName(){
  document.getElementById('bracketPage').style.display='none';
  document.getElementById('namePage').style.display='flex';
  document.getElementById('nameInput').value='';
  document.getElementById('nameHint').textContent='';
  document.getElementById('nameHint').className='n-hint';
  document.getElementById('emojiWrap').style.display='none';
  document.getElementById('enterBtn').className='n-btn';
  document.getElementById('emojiGrid').innerHTML='';
  wins=[{},{},{},{},{}]; navd=false;
  setTimeout(()=>document.getElementById('nameInput').focus(),200);
}

function encodePlayerKey(name){
  return name.replace(/[.#$\/\[\] ]/g,'_');
}

// ══ Bracket ══
function normWins(raw){
  if(!raw) return [{},{},{},{},{}];
  const arr=Array.isArray(raw)?raw:[0,1,2,3,4].map(i=>raw[i]||{});
  while(arr.length<5) arr.push({});
  return arr.map(r=>(!r||typeof r!=='object'||Array.isArray(r))?{}:r);
}

function gT(ri,mi,s){
  if(ri===0) return ROLES[mi*2+s];
  const r=wins[ri-1]||{};
  return r[mi*2+s]??r[String(mi*2+s)]??null;
}

function gW(ri,mi){ const r=wins[ri]||{}; return r[mi]??r[String(mi)]??null; }

function prevDone(ri){
  if(ri===0) return true;
  const p=wins[ri-1]||{};
  for(let i=0;i<N[ri-1];i++) if(!p[i]&&!p[String(i)]) return false;
  return true;
}

function top3(){
  const champ=wins[TOTAL-1]?.[0]??wins[TOTAL-1]?.['0']??null;
  const t0=gT(TOTAL-1,0,0), t1=gT(TOTAL-1,0,1);
  const finalist=champ?(champ===t0?t1:t0):null;
  const thirds=[];
  for(let mi=0;mi<N[TOTAL-2];mi++){
    const w=gW(TOTAL-2,mi);
    if(w){const a=gT(TOTAL-2,mi,0),b=gT(TOTAL-2,mi,1);thirds.push(w===a?b:a);}
  }
  return{champ,finalist,thirds:thirds.filter(Boolean)};
}

function initRound(){
  if(navd) return;
  for(let ri=0;ri<TOTAL;ri++){
    const cnt=Object.values(wins[ri]||{}).filter(v=>v&&typeof v==='string').length;
    if(cnt<N[ri]){curRound=ri;return;}
  }
  curRound=TOTAL-1;
}

function setRound(ri){ navd=true; curRound=ri; renderBracket(); }

function select(ri,mi,s){
  if(!prevDone(ri)){showToast('请先完成上一轮');return;}
  const t0=gT(ri,mi,0),t1=gT(ri,mi,1);
  if(!t0||!t1||t0===t1) return;
  const team=gT(ri,mi,s); if(!team) return;
  const cur=gW(ri,mi);
  if(cur===team){
    delete wins[ri][mi]; delete wins[ri][String(mi)];
    clrDown(ri,mi);
  } else if(cur&&cur!==team){ return; }
  else { wins[ri][mi]=team; }
  save(); renderBracket();
}

function clrDown(ri,mi){
  let m=mi;
  for(let r=ri+1;r<TOTAL;r++){m=Math.floor(m/2);delete wins[r][m];delete wins[r][String(m)];}
}

function save(){
  const key=encodePlayerKey(curName);
  fb.put(`${PATH}/${key}`,{name:curName,emoji:curEmoji,wins,updated:new Date().toISOString()});
}

function resetBracket(){
  if(!confirm('重新选择角色排行？')) return;
  wins=[{},{},{},{},{}]; navd=false;
  save(); renderBracket();
}

function renderBracket(){
  const {champ,finalist,thirds}=top3();

  // 前三名
  const pw=document.getElementById('podiumWrap');
  if(champ){
    pw.style.display='block';
    document.getElementById('podium').innerHTML=`
      ${finalist?`<div class="pod-card p2"><div class="pod-icon">🥈</div><div class="pod-rank">第二喜欢</div><div class="pod-role">${finalist}</div></div>`:''}
      <div class="pod-card p1"><div class="pod-icon">🥇</div><div class="pod-rank">最喜欢</div><div class="pod-role">${champ}</div></div>
      ${thirds[0]?`<div class="pod-card p3"><div class="pod-icon">🥉</div><div class="pod-rank">第三喜欢</div><div class="pod-role">${thirds[0]}</div></div>`:''}`;
  } else {
    pw.style.display='none';
  }

  // 轮次标签
  const ri=curRound;
  document.getElementById('roundTabs').innerHTML=RNAMES.map((name,i)=>{
    const cnt=Object.values(wins[i]||{}).filter(v=>v&&typeof v==='string').length;
    const done=cnt===N[i], locked=!prevDone(i);
    return`<div class="rtab${i===ri?' active':''}${done?' done':''}${locked?' locked':''}"
      onclick="${!locked?`setRound(${i})`:''}">${name}${done?' ✓':` ${cnt}/${N[i]}`}</div>`;
  }).join('');

  // 对阵卡片
  const ok=prevDone(ri);
  const cnt=Object.values(wins[ri]||{}).filter(v=>v&&typeof v==='string').length;
  const ma=document.getElementById('matchArea');

  if(!ok){
    ma.innerHTML=`<div class="m-locked">请先完成上一轮对阵</div>`;
    return;
  }

  let html='<div class="round-header" style="padding:0 0 12px;"><div class="round-title">'
    +RNAMES[ri]+'</div><div class="round-prog">'+cnt+'/'+N[ri]+' 场</div></div>';

  for(let mi=0;mi<N[ri];mi++){
    const t0=gT(ri,mi,0),t1=gT(ri,mi,1);
    const cur=gW(ri,mi);
    const canSel=ok&&t0&&t1&&t0!==t1;
    const slot=(team,s)=>{
      if(!team) return`<div class="m-slot pending">待定</div>`;
      const isW=cur===team,isL=cur&&cur!==team;
      return`<div class="m-slot${isW?' winner':isL?' loser':''}"
        onclick="${canSel&&!isL?`select(${ri},${mi},${s})`:''}">${isW?'▶ ':''}${team}</div>`;
    };
    html+=`<div class="match-card${cur?' decided':''}">
      <div class="match-num">第${mi+1}场 / ${N[ri]}</div>
      ${slot(t0,0)}<div class="m-vs">VS</div>${slot(t1,1)}
    </div>`;
  }

  if(cnt===N[ri]&&ri<TOTAL-1){
    html+=`<div class="m-next"><button class="m-next-btn" onclick="setRound(${ri+1})">
      全部选完 · 进入${RNAMES[ri+1]} →</button></div>`;
  }
  if(ri===TOTAL-1&&cnt===N[ri]&&champ){
    html+=`<div class="m-champ"><div class="m-champ-icon">🏆</div>
      <div style="font-size:11px;color:var(--dim);letter-spacing:2px">我最喜欢玩的角色</div>
      <div class="m-champ-name">${champ}</div>
      <div style="font-size:11px;color:rgba(80,200,120,0.7);margin-top:6px">结果已保存 ✓</div></div>
      <button class="gen-btn" onclick="generateImage()">🖼 生成结果图</button>
      <button class="m-reset" onclick="resetBracket()">重新选择</button>`;
  }

  ma.innerHTML=html;
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.className='toast show';
  setTimeout(()=>t.className='toast',2000);
}


// ══ 生成结果图 ══
function generateImage(){
  const{champ,finalist,thirds}=top3();
  if(!champ){showToast('请先完成所有对阵！');return;}
  const now=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('resultCard').innerHTML=`
    <div class="rc-logo">北美盗梦空间狼人杀联赛 · Season 3</div>
    <div class="rc-title">我最喜欢玩的角色！</div>
    <div class="rc-player">${curEmoji} ${curName}</div>
    <div class="rc-podium">
      ${finalist?`<div class="rc-p p2"><div class="rc-icon">🥈</div><div class="rc-rank">第二喜欢</div><div class="rc-name">${finalist}</div></div>`:''}
      <div class="rc-p p1"><div class="rc-icon">🥇</div><div class="rc-rank">最喜欢的角色</div><div class="rc-name">${champ}</div></div>
      ${thirds[0]?`<div class="rc-p p3"><div class="rc-icon">🥉</div><div class="rc-rank">第三喜欢</div><div class="rc-name">${thirds[0]}</div></div>`:''}
    </div>
    <div class="rc-footer">北美盗梦空间狼人杀联赛 · ${now}</div>
  `;
  const overlay=document.getElementById('genOverlay');
  overlay.classList.add('show');
  setTimeout(()=>{
    html2canvas(document.getElementById('resultCard'),{
      scale:2,backgroundColor:null,useCORS:true,logging:false
    }).then(canvas=>{
      overlay.classList.remove('show');
      canvas.toBlob(blob=>{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;
        a.download=`${curName}_最喜欢角色.png`;
        a.click();
        URL.revokeObjectURL(url);
      },'image/png');
    }).catch(()=>{
      overlay.classList.remove('show');
      showToast('生成失败，请截图保存');
    });
  },300);
}

// ══ 管理员入口 ══
const ADMIN_PW='inception2026';

function openAdmin(){
  // 显示全屏锁定页
  document.getElementById('adminLock').classList.add('show');
  document.getElementById('lockPwInput').value='';
  document.getElementById('lockErr').style.display='none';
  setTimeout(()=>document.getElementById('lockPwInput').focus(),200);
}
function closeAdminLock(){
  document.getElementById('adminLock').classList.remove('show');
}
function adminLogin(){
  const pw=document.getElementById('lockPwInput').value;
  if(pw===ADMIN_PW){
    document.getElementById('adminLock').classList.remove('show');
    document.getElementById('namePage').style.display='none';
    document.getElementById('bracketPage').style.display='none';
    document.getElementById('adminPage').style.display='flex';
    loadAdminData();
  } else {
    document.getElementById('lockErr').style.display='block';
    document.getElementById('lockPwInput').value='';
    document.getElementById('lockPwInput').focus();
  }
}

function closeAdmin(){
  document.getElementById('adminPage').style.display='none';
  document.getElementById('namePage').style.display='flex';
}

async function loadAdminData(){
  const el=document.getElementById('adminContent');
  el.innerHTML='<div style="color:var(--dim);font-size:13px;text-align:center;padding:30px">加载中...</div>';

  const data=await fb.get('tournament/playerBrackets');
  if(!data||!Object.keys(data).length){
    el.innerHTML='<div style="color:var(--dim);font-size:13px;text-align:center;padding:30px">暂无玩家数据</div>';
    return;
  }

  const players=Object.values(data);

  function normW(raw){
    if(!raw)return[{},{},{},{},{}];
    const arr=Array.isArray(raw)?raw:[0,1,2,3,4].map(i=>raw[i]||{});
    while(arr.length<5)arr.push({});
    return arr.map(r=>(!r||typeof r!=='object'||Array.isArray(r))?{}:r);
  }

  function getTop3(wins){
    const w=normW(wins);
    const champ=w[4]?.[0]??w[4]?.['0']??null;
    function gT(ri,mi,s){
      if(ri===0)return ROLES[mi*2+s];
      const r=w[ri-1]||{};return r[mi*2+s]??r[String(mi*2+s)]??null;
    }
    function gW(ri,mi){const r=w[ri]||{};return r[mi]??r[String(mi)]??null;}
    const t0=gT(4,0,0),t1=gT(4,0,1);
    const finalist=champ?(champ===t0?t1:t0):null;
    const thirds=[];
    for(let mi=0;mi<N[3];mi++){
      const ww=gW(3,mi);
      if(ww){const a=gT(3,mi,0),b=gT(3,mi,1);thirds.push(ww===a?b:a);}
    }
    return{champ,finalist,thirds:thirds.filter(Boolean)};
  }

  // 统计热门角色
  const roleCnt={};
  players.forEach(p=>{
    const{champ,finalist,thirds}=getTop3(p.wins);
    if(champ)roleCnt[champ]=(roleCnt[champ]||0)+3;
    if(finalist)roleCnt[finalist]=(roleCnt[finalist]||0)+2;
    if(thirds[0])roleCnt[thirds[0]]=(roleCnt[thirds[0]]||0)+1;
  });
  const topRoles=Object.entries(roleCnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxScore=topRoles[0]?.[1]||1;
  const done=players.filter(p=>getTop3(p.wins).champ);
  const notDone=players.filter(p=>!getTop3(p.wins).champ);

  let html='';

  // 热门角色汇总
  if(topRoles.length){
    html+=`<div class="a-sec">
      <div class="a-sec-title">🔥 最受欢迎角色 · 综合排名</div>
      <div class="a-summary">
        ${topRoles.map(([role,score])=>`
          <div class="a-bar-row">
            <div class="a-bar-role">${role}</div>
            <div class="a-bar-wrap"><div class="a-bar-fill" style="width:${Math.round(score/maxScore*100)}%"></div></div>
            <div class="a-bar-cnt">${score}分</div>
          </div>`).join('')}
        <div style="font-size:10px;color:var(--dim);margin-top:10px;letter-spacing:1px;">冠军+3分 · 亚军+2分 · 季军+1分</div>
      </div>
    </div>`;
  }

  // 玩家列表
  html+=`<div class="a-sec">
    <div class="a-sec-title">👥 玩家结果 · 已完成 ${done.length} 人 / 共 ${players.length} 人</div>`;

  if(done.length){
    html+=`<div style="display:grid;grid-template-columns:24px 1fr 80px 80px 80px;gap:8px;padding:5px 12px;font-size:10px;color:var(--dim);letter-spacing:1px;margin-bottom:4px;">
      <div></div><div>玩家</div><div>🥇最喜欢</div><div>🥈第二</div><div>🥉第三</div>
    </div>`;
    html+=done.map((p,i)=>{
      const{champ,finalist,thirds}=getTop3(p.wins);
      return`<div class="vote-row">
        <div style="font-weight:700;color:var(--dim);text-align:center;font-family:'Courier Prime',monospace;font-size:11px;">${i+1}</div>
        <div style="font-weight:700;font-size:13px;">${p.emoji||'🎭'} ${p.name||'?'}</div>
        <div><span class="vtag p1">${champ||'—'}</span></div>
        <div><span class="vtag p2">${finalist||'—'}</span></div>
        <div><span class="vtag p3">${thirds[0]||'—'}</span></div>
      </div>`;
    }).join('');
  }

  if(notDone.length){
    html+=`<div style="margin-top:14px;font-size:11px;color:var(--dim);letter-spacing:1px;margin-bottom:8px;">未完成（${notDone.length}人）：</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${notDone.map(p=>`<div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:12px;">${p.emoji||'🎭'} ${p.name}</div>`).join('')}
      </div>`;
  }

  html+=`</div>`;
  el.innerHTML=html;
}
</script>
